services:
  db:
    image: pgvector/pgvector:pg17
    shm_size: "256mb"
    environment:
      POSTGRES_DB: coordination_audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: isolated-demo-only
    volumes: ["audit_database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U audit -d coordination_audit"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: aicte-coordination:local
    environment: &audit_environment
      POSTGRES_DB: coordination_audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: isolated-demo-only
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: isolated-audit-not-deployment
      DEMO_PASSWORD: Demo-only-26264!
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      MODEL_PATH: /models/minilm
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENABLE_REVIEWED_FACTS: ${ENABLE_REVIEWED_FACTS:-0}
      ENABLE_INCIDENT_GROUPS: ${ENABLE_INCIDENT_GROUPS:-0}
    command: python manage.py runserver 0.0.0.0:8000 --noreload --insecure
    ports: ["127.0.0.1:8001:8000"]
    volumes: &audit_volumes
      - ./backend:/app:ro
      - ./tests:/app/tests:ro
      - ${AUDIT_RESULTS:-./tests/results/runs/local}:/app/tests/results
      - ${AUDIT_RESULTS:-./tests/results/runs/local}:/reports
      - ./models:/models:ro
      - audit_private:/app/private
      - audit_data:/data
    depends_on:
      db: {condition: service_healthy}
  worker:
    image: aicte-coordination:local
    environment: *audit_environment
    command: python manage.py qcluster
    volumes: *audit_volumes
    depends_on:
      db: {condition: service_healthy}
volumes:
  audit_database:
  audit_private:
  audit_data:
