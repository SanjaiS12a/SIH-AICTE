services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coordination}
      POSTGRES_USER: ${POSTGRES_USER:-coordination}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports: ["127.0.0.1:${DB_PORT:-5438}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: aicte-coordination:local
    build: ./backend
    environment: &environment
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-coordination}
      POSTGRES_USER: ${POSTGRES_USER:-coordination}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-change-before-sharing}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-only-26264!}
      MODEL_PATH: /models/minilm
      HF_HUB_OFFLINE: "1"
    command: python manage.py runserver 0.0.0.0:8000 --noreload --insecure
    ports: ["127.0.0.1:8000:8000"]
    volumes: &volumes
      - ./backend:/app
      - ./tests:/app/tests
      - ./models:/models
      - ./data:/data
      - ./tests/results:/reports
    depends_on:
      db: {condition: service_healthy}
  worker:
    image: aicte-coordination:local
    environment: *environment
    command: python manage.py qcluster
    volumes: *volumes
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
